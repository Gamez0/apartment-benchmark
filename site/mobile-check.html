<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>모바일 반응형 검증</title><style>body{font:16px system-ui;background:#e9edf4;margin:0;padding:12px}header{display:flex;justify-content:center;gap:12px;padding:8px}select{font:inherit}iframe{display:block;margin:auto;border:1px solid #bac4d4;background:white;height:844px;width:390px;max-width:100%}</style></head><body><header><label>검증 너비 <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option></select>px</label><span>실제 기기 검사와 구분되는 브라우저 검증 화면</span></header><iframe id="preview" title="모바일 서비스" src="index.html?app=scope22"></iframe><script>document.getElementById('width').onchange=e=>{const f=document.getElementById('preview');f.style.width=e.target.value+'px';f.src='index.html?app=scope22&viewport='+e.target.value;};</script></body></html>
