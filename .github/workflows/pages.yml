name: Publish apartment benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/engine.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/import.test.py
      - run: python scripts/prepare_data.py
      - run: node tests/app.test.cjs
      - run: node tests/comparison.test.cjs
      - run: python tests/molit.test.py
      - name: Collect official Sindorim transactions
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_API_ENDPOINT: ${{ secrets.MOLIT_API_ENDPOINT }}
        run: python scripts/collect_molit.py
      - run: python scripts/prepare_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
