name: Publish apartment benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Force official transaction refresh
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/engine.test.cjs
      - run: node tests/priorities.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/import.test.py
      - run: python scripts/prepare_data.py
      - run: node tests/app.test.cjs
      - run: node tests/comparison.test.cjs
      - run: python tests/molit.test.py
      - run: python tests/cache.test.py
      - uses: actions/cache/restore@v4
        with:
          path: data/seoul-cache
          key: seoul-months-v1-${{ github.run_id }}
          restore-keys: seoul-months-v1-
      - name: Collect official Seoul transactions
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_API_ENDPOINT: ${{ secrets.MOLIT_API_ENDPOINT }}
          FULL_REFRESH: ${{ inputs.refresh_data }}
        run: python scripts/collect_seoul.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/seoul-cache
          key: seoul-months-v1-${{ github.run_id }}
      - run: python scripts/prepare_data.py
      - run: node scripts/build_seoul.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
