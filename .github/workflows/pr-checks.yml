name: Pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare_data.py
      - run: node tests/engine.test.cjs
      - run: node tests/priorities.test.cjs
      - run: node tests/app.test.cjs
      - run: node tests/comparison.test.cjs
      - run: node tests/explore.test.cjs
      - run: node tests/seoul.test.cjs
      - run: python tests/finance.audit.py
      - run: node --check site/app.js
      - run: node --check tests/browser/move-input-clarity.spec.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic browser input checks
        run: >-
          docker run --rm --shm-size=1g -e CI=1
          -v "$GITHUB_WORKSPACE:/work" -w /work
          mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
          /bin/bash -lc "npx playwright test tests/browser/move-input-synthetic.spec.cjs tests/browser/explore-synthetic.spec.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
